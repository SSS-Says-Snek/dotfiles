#
# Please note not all available settings / options are set here.
# For a full list, see the wiki

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=DP-1, 2560x1440@144, 0x0, 1, bitdepth, 10

# Some default env vars.
env = XCURSOR_SIZE,24

env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm # firefox crash >:(
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct

env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_QPA_PLATFORMTHEME,qt5ct

env = ELECTRON_OZONE_PLATFORM_HINT,wayland

cursor {
  no_hardware_cursors = false # true?
  zoom_rigid = true
}

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0.0 # -1.0 - 1.0, 0 means no modification.
}

general {
    gaps_in = 10
    gaps_out = 20
    border_size = 2
    col.active_border = rgba(b4befeee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 4
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        noise = 0
        brightness = 0.90
    }   

    # drop_shadow = yes
    # shadow_range = 4
    # shadow_render_power = 3
    # col.shadow = rgba(1a1a1aee)
}

animations {
    enabled = yes

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
    special_scale_factor = 1.0
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
}

binds {
    allow_workspace_cycles = true
}

plugin {
    hyprwinwrap {
        # class is an EXACT match and NOT a regex!
        class = kitty-bg
        # you can also use title
        title = kitty-bg
        # you can add the position of the window in a percentage
        # pos_x = 25
        # pos_y = 30
        # # you can add the size of the window in a percentage
        # size_x = 40
        # size_y = 70
    }
}


gesture = 3, horizontal, workspace 

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = ALT

bind = $mainMod, Q, exec, kitty
bind = $mainMod, C, killactive, 
bind = $mainMod, V, togglefloating, 
bind = $mainMod, R, exec, rofi -show drun -theme ~/.config/rofi/launcher.rasi
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, S, togglesplit, # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

##########################################################
#                     Hey Guys                           #
##########################################################

# IDK
layerrule {
  name = layerrule-1
  blur = on
  ignore_alpha = 0
  match:namespace = rofi
}

# layerrule = ignorealpha,rofi
layerrule {
  name = layerrule-2
  no_anim = on
  match:namespace = hyprpicker
}

layerrule {
  name = layerrule-3
  no_anim = on
  match:namespace = selection
}


#######################################################
#                      EXEC ONCES                     #
#######################################################
exec-once = awww-daemon
exec-once = gammastep-indicator
exec-once = waybar
exec-once = swaync
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = awww img wallpapers/moony-night.png 
exec-once = fcitx5 && fcitx5-remote -r
exec-once = copyq --start-server
exec-once = udiskie &
exec-once = /opt/KopiaUI/kopia-ui
exec-once = hyprctl setcursor phinger-cursors-dark 24

exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment QT_QPA_PLATFORMTHEME

# Trays
exec-once = nm-applet
exec-once = pasystray
exec-once = blueman-tray

# yeahhh
# exec-once = diurnals # Wait until the guy bumps the python-data-wizard on AUR to fix ts
exec-once = flatpak run io.github.sss_says_snek.diurnals

# EXECS
exec-once = [workspace 1 silent] firefox
exec-once = [workspace 2 silent] kitty
exec-once = [workspace 4 silent] discord
exec-once = [workspace 7 silent] pear-desktop

#######################################################
#                    WINDOW RULES                     #
#######################################################
windowrule {
  name = windowrule-1
  opacity = 0.9 0.85
  match:class = ^(kitty|discord|vesktop|org.prismlauncher.PrismLauncher)$
}


## FLOATS
windowrule {
  name = windowrule-2
  float = on
  match:class = ^(org.pulseaudio.pavucontrol)$
}

windowrule {
  name = windowrule-3
  float = on
  match:class = ^(blueman-manager|Pinentry-gtk-2|com.github.hluk.copyq|xdg-desktop-portal-gtk|RimPy)$
}

windowrule {
  name = windowrule-4
  float = on
  match:class = ^(org.gnome.FileRoller|file-roller)$
}

windowrule {
  name = windowrule-5
  float = on
  match:class = (firefox)
  match:title = (Library)(.*)$
}

windowrule {
  name = windowrule-6
  float = on
  match:class = (main\.py)$
}

windowrule {
  name = windowrule-7
  float = on
  match:class = (rquickshare)$
}

windowrule {
  name = windowrule-8
  float = on
  match:class = ^(io\.github\.sss_says_snek\.diurnals)$
}


windowrule {
  name = windowrule-9
  float = on
  match:class = ^firefox$
  match:title = ^Extension:(.*)$
}

windowrule {
  name = windowrule-10
  suppress_event = maximize
  match:class = ^(io.github.celluloid_player.Celluloid)$
}


windowrule {
  name = windowrule-11
  fullscreen = on
  match:class = ^steam_app\d+$
}

windowrule {
  name = windowrule-12
  monitor = 1
  match:class = ^steam_app_\d+$
}

windowrule {
  name = windowrule-13
  tag = +drpopup
  match:class = ^(resolve)$
  match:float = 1
}

windowrule {
  name = windowrule-14
  stay_focused = on
  match:tag = drpopup
}

#######################################################
#                    CUSTOM BINDS                     #
#######################################################
bind = $mainMod SHIFT, N, exec, swaync-client -t -sw
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod SHIFT, E, exec, ~/.config/rofi/power-menu.sh
bind = $mainMod, F, exec, nautilus --new-window
bind = $mainMod, TAB, workspace, previous
bind = $mainMod, W, exec, wayscriber -a

# Print screen
bind = ,Print, exec, grimblast copy area
bind = Shift, Print, exec, grimblast copy screen
bind = Ctrl, Print, exec, grimblast save area - | swappy -f -
bind = SUPER, Print, exec, grimblast --freeze copy area - | swappy -f -
bind = SUPER, F, fullscreen, 0
bind = SUPER, K, movetoworkspace, special
bind = SUPER, F8, togglespecialworkspace
bind = SUPER, C, exec, copyq toggle

# FIRE UTILITY KEYBINDS
binde = ,XF86AudioRaiseVolume, exec, pamixer --set-limit 250 --allow-boost --increase 2
binde = ,XF86AudioLowerVolume, exec, pamixer --set-limit 250 --allow-boost --decrease 2
binde = SUPER, W, exec, pamixer --set-limit 250 --allow-boost --increase 2
binde = SUPER, S, exec, pamixer --set-limit 250 --allow-boost --decrease 2
binde = SUPER, M, exec, pamixer --toggle-mute

# Mouse side buttons
bind = $mainMod, mouse:275, killactive

# Le Olde headset
bind = SUPER, A, exec, pactl set-default-sink alsa_output.pci-0000_80_1f.3.analog-stereo
# bind = SUPER, A, exec, pactl set-default-sink alsa_output.usb-Logitech_G432_Gaming_Headset_000000000000-00.analog-stereo 
bind = SUPER, D, exec, pactl set-default-sink alsa_output.pci-0000_01_00.1.hdmi-stereo

bind = ,XF86AudioMute, exec, pamixer --toggle-mute
binde = ,XF86MonBrightnessUp, exec, brightnessctl set 5%+
binde = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Global keybinds
bind = ,Home, pass, class:^(com\.obsproject\.Studio)$ 

# binde = Ctrl+Super, up, exec, hyprctl keyword cursor:zoom_factor $(awk "BEGIN {print $(hyprctl getoption cursor:zoom_factor | grep 'float:' | awk '{print $2}') + 0.5}") # Zoom out
# binde = Ctrl+Super, down, exec, hyprctl keyword cursor:zoom_factor $(awk "BEGIN {print $(hyprctl getoption cursor:zoom_factor | grep 'float:' | awk '{print $2}') - 0.5}") # Zoom in

binde = Ctrl+Super, equal, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor * 1.25}')"
binde = Ctrl+Super, minus, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor / 1.25}')"
binde = Ctrl+Super, 0, exec, hyprctl keyword cursor:zoom_factor 1

bind = SUPER, x, exec, ~/.config/waybar/scripts/toggle-hyprland-bindings.sh toggle
submap = clean
bind = SUPER, x, exec, ~/.config/waybar/scripts/toggle-hyprland-bindings.sh toggle
submap = reset
